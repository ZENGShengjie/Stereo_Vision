<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control Panel — Stereo Vision</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/control.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Control Panel</h1>
      <a href="/" class="back-link">&#8592; Home</a>
    </div>

    <div class="control-layout">
      <!-- Left: form -->
      <div class="control-form-col">
        <div id="loading-msg">Loading parameters...</div>

        <form id="params-form" hidden>
          <div class="params-grid">
            <div class="param-group">
              <h3>Geometry</h3>
              <label class="param-row">
                <span class="param-label">crop</span>
                <input type="range" id="crop" name="crop" min="0.5" max="1.0" step="0.01" value="0.7">
                <span class="param-value" id="crop-val">0.70</span>
              </label>
              <label class="param-row">
                <span class="param-label">xshift</span>
                <input type="range" id="xshift" name="xshift" min="-80" max="80" step="1" value="0">
                <span class="param-value" id="xshift-val">0</span>
              </label>
              <label class="param-row">
                <span class="param-label">gshift_x</span>
                <input type="range" id="gshift_x" name="gshift_x" min="-200" max="200" step="1" value="0">
                <span class="param-value" id="gshift_x-val">0</span>
              </label>
              <label class="param-row">
                <span class="param-label">gshift_y</span>
                <input type="range" id="gshift_y" name="gshift_y" min="-200" max="200" step="1" value="0">
                <span class="param-value" id="gshift_y-val">0</span>
              </label>
            </div>

            <div class="param-group">
              <h3>Distortion</h3>
              <label class="param-row">
                <span class="param-label">k1</span>
                <input type="range" id="k1" name="k1" min="-0.5" max="0.5" step="0.01" value="-0.18">
                <span class="param-value" id="k1-val">-0.18</span>
              </label>
              <label class="param-row">
                <span class="param-label">k2</span>
                <input type="range" id="k2" name="k2" min="-0.5" max="0.5" step="0.01" value="0.04">
                <span class="param-value" id="k2-val">0.04</span>
              </label>
            </div>

            <div class="param-group">
              <h3>Separator</h3>
              <label class="param-row">
                <span class="param-label">sep</span>
                <input type="range" id="sep" name="sep" min="0" max="200" step="1" value="40">
                <span class="param-value" id="sep-val">40</span>
              </label>
            </div>

            <div class="param-actions">
              <button type="submit" class="btn-primary">Apply</button>
              <button type="button" id="reset-btn" class="btn-secondary">Reset to Defaults</button>
            </div>
          </div>
        </form>

        <div id="apply-msg" class="apply-msg" hidden></div>
      </div>

      <!-- Right: live preview -->
      <div class="control-preview-col">
        <div class="preview-label">Live Preview</div>
        <div class="preview-wrap">
          <img id="preview-img" src="/video_feed" alt="Preview">
        </div>
        <div class="preview-hint">Updates every 2s after Apply</div>
      </div>
    </div>
  </div>

  <script src="/static/js/control_panel.js"></script>
</body>
</html>

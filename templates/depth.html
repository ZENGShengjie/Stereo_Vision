<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Depth View — Stereo Vision</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/depth.css">
  <style>
    .depth-info {
      display: flex;
      gap: 16px;
      padding: 6px 16px;
      background: #111;
      border-bottom: 1px solid #222;
      font-size: 12px;
      color: #888;
      font-family: monospace;
    }
    .depth-info a { color: #6cf; text-decoration: none; }
    .depth-info span { color: #6cf; }
    .depth-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .depth-legend {
      padding: 4px 16px;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #888;
      font-family: monospace;
    }
    .legend-bar {
      width: 120px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
    }
    .legend-label { color: #6cf; }
  </style>
</head>
<body>
  <div class="depth-info">
    <a href="/">&#8592; Home</a>
    <span id="fps-display">FPS: --</span>
    <span id="stats-display">min --m  mean --m  max --m  cov --%</span>
  </div>
  <div class="depth-legend">
    <span class="legend-label">0.1m</span>
    <div class="legend-bar"></div>
    <span class="legend-label">5.0m</span>
    <span style="margin-left:8px;color:#4f8">近</span>
    <span>--</span>
    <span style="color:#6cf">远</span>
  </div>
  <div class="depth-wrap">
    <img id="depth-img" alt="Depth feed">
  </div>
  <script>
    (function () {
      var fpsEl = document.getElementById("fps-display");
      var statsEl = document.getElementById("stats-display");
      var img = document.getElementById("depth-img");
      var lastTime = performance.now();
      var frameCount = 0;

      // Use streaming MJPEG feed - much more responsive than polling
      img.src = "/depth/feed";

      img.onload = function () {
        frameCount++;
        var now = performance.now();
        if (now - lastTime >= 1000) {
          fpsEl.textContent = "FPS: " + frameCount;
          frameCount = 0;
          lastTime = now;
        }
      };

      img.onerror = function () {
        // If feed drops, fall back to polling snapshots
        img.src = "/depth/snapshot?_t=" + Date.now();
        setTimeout(function reload() {
          img.src = "/depth/snapshot?_t=" + Date.now();
        }, 500);
      };

      (function pollStats() {
        fetch("/api/depth/stats")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            statsEl.textContent =
              "min " + data.min.toFixed(2) +
              "m  mean " + data.mean.toFixed(2) +
              "m  max " + data.max.toFixed(2) +
              "m  cov " + (data.coverage * 100).toFixed(0) + "%";
          })
          .catch(function () {});
        setTimeout(pollStats, 500);
      })();
    })();
  </script>
</body>
</html>

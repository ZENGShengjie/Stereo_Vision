<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HUD View — Stereo Vision</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/hud.css">
</head>
<body>
  <!-- 顶部调参条(2026-07-04): 视频上方一条横向 HUD, 含读数 + 按钮 + 输入框 -->
  <div id="hud-bar" class="hud-bar">
    <div class="hud-section hud-readouts">
      <div class="hud-stat"><span class="lbl">FPS</span><span class="val" id="hud-fps">--</span></div>
      <div class="hud-stat"><span class="lbl">depth</span><span class="val" id="hud-depth">--</span><span class="unit">cm</span></div>
      <div class="hud-stat"><span class="lbl">disp</span><span class="val" id="hud-disp">--</span></div>
      <div class="hud-stat"><span class="lbl">conf</span><span class="val" id="hud-conf">--</span><span class="badge" id="hud-quality">--</span></div>
      <div class="hud-stat"><span class="lbl">status</span><span class="val" id="hud-status">--</span></div>
      <div class="hud-stat"><span class="lbl">path</span><span class="val" id="hud-path">--</span></div>
    </div>

    <div class="hud-section hud-controls">
      <!-- 5 个动态参数, 实时显示 + 数字输入 -->
      <label class="hud-ctrl" data-key="DISP_SCALE">
        <span class="lbl">DISP_SCALE</span>
        <input type="number" step="0.01" id="hw-DISP_SCALE">
        <button class="btn-set" data-key="DISP_SCALE">SET</button>
      </label>
      <label class="hud-ctrl" data-key="BASELINE_CM">
        <span class="lbl">BASELINE (cm)</span>
        <input type="number" step="0.1" id="hw-BASELINE_CM">
        <button class="btn-set" data-key="BASELINE_CM">SET</button>
      </label>
      <label class="hud-ctrl" data-key="HFOV_DEG">
        <span class="lbl">HFOV (deg)</span>
        <input type="number" step="0.1" id="hw-HFOV_DEG">
        <button class="btn-set" data-key="HFOV_DEG">SET</button>
      </label>
      <label class="hud-ctrl" data-key="SGBM_NUM_DISPARITIES">
        <span class="lbl">NUM_DISP</span>
        <input type="number" step="16" id="hw-SGBM_NUM_DISPARITIES">
        <button class="btn-set" data-key="SGBM_NUM_DISPARITIES">SET</button>
      </label>
      <label class="hud-ctrl" data-key="SGBM_BLOCK_SIZE">
        <span class="lbl">BLOCK</span>
        <input type="number" step="2" id="hw-SGBM_BLOCK_SIZE">
        <button class="btn-set" data-key="SGBM_BLOCK_SIZE">SET</button>
      </label>
      <!-- 快捷按钮 -->
      <div class="hud-quick">
        <button id="btn-real-cm">真距校准 (cm)</button>
        <input type="number" id="real-cm-input" value="25" step="0.5">
        <button id="btn-reset">恢复默认</button>
      </div>
    </div>

    <!-- 右上角开关按钮 -->
    <button id="hud-toggle-btn" class="hud-toggle-btn" title="隐藏/显示 HUD">[ - ]</button>
  </div>

  <!-- 视频流 (复用 /video_feed MJPEG) -->
  <div id="video-wrap" class="hud-video-wrap">
    <img id="stereo-feed" alt="Stereo feed">
  </div>

  <!-- 底部状态条 / 折叠后才显示 -->
  <div id="hud-foot" class="hud-foot"></div>

  <script src="/static/js/hud.js"></script>
</body>
</html>
